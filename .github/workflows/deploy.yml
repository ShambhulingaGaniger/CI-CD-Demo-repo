name: Salesforce CI/CD

on:
  push:
    branches:
      - QA
      - main

jobs:

# ---------------- QA DEPLOYMENT ----------------

  deploy-qa:
    if: github.ref == 'refs/heads/QA'
    runs-on: ubuntu-latest
    environment: deploy-approval

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate QA Org
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --username ${{ secrets.SF_ORGB_USERNAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --alias qaOrg

      - name: Deploy and Run Apex Tests
        run: |
          sf project deploy start \
          --target-org qaOrg \
          --test-level RunLocalTests \
          --wait 20


# ---------------- PRODUCTION DEPLOYMENT ----------------

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate Production Org
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --username ${{ secrets.SF_ORGC_USERNAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.SF_CONSUMER_FOR_ORC_KEY }} \
            --alias prodOrg

      - name: Deploy to Production with Tests
        run: |
          sf project deploy start \
          --target-org prodOrg \
          --test-level RunLocalTests \
          --wait 20